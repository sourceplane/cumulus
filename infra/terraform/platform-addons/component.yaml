apiVersion: sourceplane.io/v1
kind: Component
metadata:
  name: platform-addons
  description: "IRSA roles for the AWS Load Balancer Controller, external-dns and the EBS CSI driver"
  labels:
    domain: infra
    scope: aws
spec:
  type: terraform-aws
  lifecycle: production
  owner: platform
  domain: infra
  path: infra/terraform/platform-addons
  dependsOn:
    - component: eks
  parameters:
    stackName: platform-addons
    terraformDir: terraform
    terraformVersion: "1.15.3"
    # SEC-JOB: post-apply these outputs are queued on the runner's sink and
    # lease-published onto the project/{{env}} rung by the runner. Downstream
    # components read the same keys through secretEnv.
    secretOutputs: "ALB_CONTROLLER_ROLE_ARN=alb_controller_role_arn,EXTERNAL_DNS_ROLE_ARN=external_dns_role_arn,EBS_CSI_ROLE_ARN=ebs_csi_role_arn"
  secretEnv:
    TF_VAR_oidcProviderArn: "secret://cumulus/cumulus/{{ .environment }}/OIDC_PROVIDER_ARN"
    TF_VAR_oidcProviderUrl: "secret://cumulus/cumulus/{{ .environment }}/OIDC_PROVIDER_URL"
  subscribe:
    environments:
      # dev is credential-free: the validate profile excludes the OIDC
      # capability entirely, so this lane has no path to AWS.
      - name: dev
        profile: validate
      - name: stage
        profile: plan-only
        profileRules:
          - profile: apply
            when:
              triggerRef: github-push-main
      - name: prod
        profile: plan-only
        profileRules:
          - profile: apply
            when:
              triggerRef: github-push-main
  labels:
    team: platform
    layer: infrastructure
