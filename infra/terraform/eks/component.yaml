apiVersion: sourceplane.io/v1
kind: Component
metadata:
  name: eks
  description: "EKS control plane, managed node group, IRSA provider, core add-ons"
  labels:
    domain: infra
    scope: aws
spec:
  type: terraform-aws
  lifecycle: production
  owner: platform
  domain: infra
  path: infra/terraform/eks
  dependsOn:
    - component: vpc
  parameters:
    stackName: eks
    terraformDir: terraform
    terraformVersion: "1.15.3"
    # SEC-JOB: post-apply these outputs are queued on the runner's sink and
    # lease-published onto the project/{{env}} rung by the runner. Downstream
    # components read the same keys through secretEnv.
    secretOutputs: "CLUSTER_NAME=cluster_name,CLUSTER_ENDPOINT=cluster_endpoint,OIDC_PROVIDER_ARN=oidc_provider_arn,OIDC_PROVIDER_URL=oidc_provider_url,NODE_SECURITY_GROUP_ID=node_security_group_id"
  secretEnv:
    TF_VAR_vpcId: "secret://cumulus/cumulus/{{ .environment }}/VPC_ID"
    TF_VAR_privateSubnetIds: "secret://cumulus/cumulus/{{ .environment }}/PRIVATE_SUBNET_IDS"
    TF_VAR_publicSubnetIds: "secret://cumulus/cumulus/{{ .environment }}/PUBLIC_SUBNET_IDS"
  subscribe:
    environments:
      # dev is credential-free: the validate profile excludes the OIDC
      # capability entirely, so this lane has no path to AWS.
      - name: dev
        profile: validate
      - name: stage
        profile: plan-only
        profileRules:
          - profile: apply
            when:
              triggerRef: github-push-main
      - name: prod
        profile: plan-only
        profileRules:
          - profile: apply
            when:
              triggerRef: github-push-main
  labels:
    team: platform
    layer: infrastructure
